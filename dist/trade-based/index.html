<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Watch — AML Vision Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e12;--bg2:#10131a;--panel:#151922;--panel2:#1a1f29;
    --line:#262c39;--line2:#333b4c;--ink:#e9ebf0;--muted:#98a2b5;--faint:#6a7388;
    --signal:#f6a623;--teal:#4fd1c5;--blue:#5aa9ff;--rose:#ef6079;--green:#54c98a;--violet:#b08cff;
    --accent:var(--signal);
    --mono:'JetBrains Mono',ui-monospace,monospace;--body:'Archivo',system-ui,sans-serif;--display:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 84% -10%,rgba(246,166,35,.08),transparent 60%),
      radial-gradient(820px 460px at -6% 8%,rgba(90,169,255,.06),transparent 55%),
      var(--bg);
    color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column}
  .shell{max-width:1080px;margin:0 auto;width:100%;padding:0 22px;flex:1;display:flex;flex-direction:column}

  /* header */
  header{padding:26px 0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:34px;height:34px;border-radius:9px;border:1px solid var(--signal);display:grid;place-items:center;color:var(--signal);font-family:var(--mono);font-size:15px;box-shadow:0 0 18px -4px var(--signal) inset}
  .brand .bt{font-family:var(--display);font-size:20px;line-height:1}
  .brand .bs{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-top:3px}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);border:1px solid var(--signal);border-radius:999px;padding:6px 12px;background:rgba(246,166,35,.06)}

  /* stepper */
  .stepper{display:flex;gap:4px;padding:16px 0;overflow-x:auto}
  .step{flex:1;min-width:84px;cursor:pointer;opacity:.5;transition:.25s}
  .step.done,.step.active{opacity:1}
  .step .sbar{height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
  .step.done .sbar,.step.active .sbar{background:var(--signal)}
  .step .sl{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:7px;white-space:nowrap}
  .step.active .sl{color:var(--ink)}

  /* stage */
  .stage{flex:1;padding:24px 0 8px;min-height:430px;position:relative}
  .scene{animation:fade .5s cubic-bezier(.2,.7,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal);margin-bottom:10px}
  h2{font-family:var(--display);font-weight:500;font-size:clamp(24px,4vw,36px);line-height:1.08;letter-spacing:-.01em;margin-bottom:12px}
  h2 em{font-style:italic;color:var(--muted)}
  .lead{color:var(--muted);max-width:680px;font-size:15.5px;margin-bottom:22px}
  .lead b{color:var(--ink)}

  /* coverage map */
  .covwrap{display:grid;grid-template-columns:1fr 230px;gap:20px;align-items:start}
  @media(max-width:780px){.covwrap{grid-template-columns:1fr}}
  .covgrid{display:flex;flex-direction:column;gap:6px}
  .covrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 13px;transition:.4s}
  .covrow .clabel{flex:1;font-size:13.5px}
  .covrow .csub{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
  .pill.covered{color:var(--green)}
  .pill.partial{color:var(--signal)}
  .pill.gap{color:var(--rose)}
  .covrow.flip{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 10px 30px -16px var(--green)}
  .covrow.target{border-color:var(--rose)}
  .gauge{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:13px;padding:20px;text-align:center;position:sticky;top:10px}
  .gauge .gh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .gauge .gnum{font-family:var(--display);font-size:54px;line-height:1;margin:8px 0 2px;color:var(--signal)}
  .gauge .gd{font-size:12px;color:var(--muted)}
  .gauge .gbar{height:7px;border-radius:4px;background:var(--bg2);margin-top:14px;overflow:hidden;border:1px solid var(--line)}
  .gauge .gfill{height:100%;background:linear-gradient(90deg,var(--rose),var(--signal),var(--green));transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .gauge .gdelta{font-family:var(--mono);font-size:11px;color:var(--green);margin-top:10px;opacity:0;transition:.5s}
  .gauge .gdelta.show{opacity:1}

  /* advisory ingest */
  .ingest{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:780px){.ingest{grid-template-columns:1fr}}
  .doc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:18px;position:relative}
  .doc .docmeta{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
  .doc .doctext{font-family:var(--display);font-size:14.5px;line-height:1.6;color:var(--muted);min-height:188px}
  .doc .doctext .hl{color:var(--ink);background:rgba(246,166,35,.14);border-radius:3px;padding:0 2px}
  /* advisory_full: verbatim public-domain source rendered scrollable, attribution kept distinct from the illustrative badge */
  .doc .docsrc{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--signal);margin-bottom:10px;line-height:1.5}
  .doc .docsrc b{text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  .doc .docfull{font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--muted);max-height:300px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:break-word;border-top:1px solid var(--line);padding-top:12px}
  .caret{display:inline-block;width:7px;height:15px;background:var(--signal);vertical-align:-2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .extracted{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:18px}
  .extracted .eh{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;display:flex;justify-content:space-between}
  .extracted .eh b{color:var(--signal);font-weight:500}
  .sig{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--signal);background:var(--bg2);border-radius:8px;padding:9px 12px;margin-bottom:7px;opacity:0;transform:translateX(8px);animation:sigin .4s forwards}
  @keyframes sigin{to{opacity:1;transform:none}}
  .sig .sigid{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none}
  .sig .signame{font-size:13px;flex:1}
  .sig .sigtype{font-family:var(--mono);font-size:9px;color:var(--signal);border:1px solid var(--signal);border-radius:5px;padding:2px 6px}

  /* assessment matrix */
  .matrix{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mrow{display:grid;grid-template-columns:1fr 150px 150px;gap:0;border-bottom:1px solid var(--line);align-items:center}
  .mrow:last-child{border-bottom:0}
  .mrow.head{background:var(--panel2)}
  .mrow.head .mc{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .mc{padding:11px 14px;font-size:13px}
  .mc.sig{font-weight:500}
  .mc .mid{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:7px}
  .stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .mrow.opportunity{background:rgba(239,96,121,.06)}
  .mrow.opportunity .mc.sig{color:var(--ink)}
  .flag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);border:1px solid var(--rose);border-radius:5px;padding:2px 6px;margin-left:8px}

  /* selection gate */
  .gatebox{border:1px solid var(--signal);border-radius:12px;background:rgba(246,166,35,.04);padding:8px 8px;margin-bottom:18px}
  .gatebox .gtag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);padding:8px 12px 4px}
  .selrow{display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:12px 14px;margin:8px;cursor:pointer;transition:.18s}
  .selrow:hover{border-color:var(--line2)}
  .selrow.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
  .selrow.disabled{opacity:.45;cursor:not-allowed}
  .cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;transition:.18s}
  .selrow.on .cbox{background:var(--signal);border-color:var(--signal);color:#0c0e12;font-weight:700}
  .selinfo{flex:1}
  .selinfo .sn{font-size:14px;font-weight:600}
  .selinfo .sd{font-size:12px;color:var(--muted)}
  .dataflag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:5px;padding:3px 7px;white-space:nowrap}
  .dataflag.av{color:var(--green)}
  .dataflag.pa{color:var(--signal)}
  .dataflag.no{color:var(--rose)}

  /* build proposal */
  .proposal{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
  @media(max-width:780px){.proposal{grid-template-columns:1fr}}
  .spec{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}
  .spec .spech{background:var(--panel2);border-bottom:1px solid var(--line);padding:12px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--signal);display:flex;justify-content:space-between}
  .specrow{display:flex;gap:12px;padding:10px 16px;border-bottom:1px dashed var(--line);font-size:12.5px}
  .specrow:last-child{border-bottom:0}
  .specrow .sk{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);flex:none;width:96px;padding-top:2px}
  .specrow .sv{color:var(--ink)}
  .specrow .sv code{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--teal)}
  .buildside{display:flex;flex-direction:column;gap:12px}
  .buildlog{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:16px;min-height:160px}
  .blstep{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--faint);padding:6px 0;transition:.3s}
  .blstep .bi{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;font-size:11px}
  .blstep.run{color:var(--ink)}
  .blstep.run .bi{border-color:var(--signal);color:var(--signal);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blstep.ok{color:var(--ink)}
  .blstep.ok .bi{border-color:var(--green);background:var(--green);color:#0c0e12}
  .blstep.gate .bi{border-color:var(--violet);color:var(--violet)}
  .blstep.gate.ok .bi{background:var(--violet);color:#0c0e12}

  /* lift chart */
  .liftwrap{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
  @media(max-width:780px){.liftwrap{grid-template-columns:1fr}}
  .lift{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:22px}
  .liftbar{margin-bottom:16px}
  .liftbar .llabel{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .liftbar .llabel .ln{color:var(--ink)}
  .liftbar .llabel .ln .combo{font-family:var(--mono);font-size:10px;color:var(--faint);display:block;margin-top:2px}
  .liftbar .llabel .lv{font-family:var(--mono);font-weight:700}
  .track{height:14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:7px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
  .fill.weak{background:linear-gradient(90deg,#6a3a3a,var(--rose))}
  .fill.mid{background:linear-gradient(90deg,#7a5a1f,var(--signal))}
  .fill.strong{background:linear-gradient(90deg,#2f6a47,var(--green))}
  .liftside{border:1px solid var(--line2);border-left:3px solid var(--signal);background:rgba(246,166,35,.05);border-radius:0 12px 12px 0;padding:18px}
  .liftside .lt{font-family:var(--display);font-size:18px;font-style:italic;margin-bottom:8px}
  .liftside p{font-size:13px;color:var(--muted)}
  .firestat{display:flex;gap:18px;margin-bottom:20px;flex-wrap:wrap}
  .firestat .fs{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--panel)}
  .firestat .fsn{font-family:var(--display);font-size:26px;color:var(--ink)}
  .firestat .fsl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}

  /* closing */
  .closing{text-align:center;max-width:640px;margin:0 auto;padding-top:10px}
  .closing .loopicon{font-size:40px;color:var(--signal);margin-bottom:10px}
  .closing h2{margin-bottom:14px}
  .recap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .recap span{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:7px 13px}
  .recap span b{color:var(--signal);font-weight:500}

  .framenote{margin-top:18px;font-size:12px;color:var(--faint);border-left:2px solid var(--line2);padding-left:12px;font-style:italic;font-family:var(--display)}

  /* controls */
  .controls{border-top:1px solid var(--line);padding:16px 0 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg) 60%,transparent)}
  .btn{font-family:var(--body);font-weight:600;font-size:14px;border-radius:10px;padding:12px 22px;cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--ink);transition:.18s}
  .btn:hover{background:var(--panel2)}
  .btn.primary{background:var(--signal);color:#0c0e12;border-color:var(--signal)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--ink)}
  .lgroup{display:flex;align-items:center;gap:6px}
  .keys{color:var(--faint)}
  .ctrlhint{font-family:var(--mono);font-size:11px;color:var(--faint)}

  footer{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;padding:0 0 18px;line-height:1.7}

  /* Reduced motion: collapse every CSS animation/transition to a single instant frame.
     Use duration:0s (NOT animation:none) so forwards-fill keyframes like .sig still settle
     to their visible end state instead of stranding on the hidden opacity:0 base.
     JS-driven reveals (advisory stream, signal extraction, build log, lift, count-ups) are
     handled separately by the REDUCED flag below — CSS alone can't reach them. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms!important;
      animation-iteration-count:1!important;
      transition-duration:.001ms!important;
      scroll-behavior:auto!important;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="mark">◈</div>
      <div><div class="bt" id="brandTitle">Signal Watch</div><div class="bs" id="brandSub">AML Detection · Vision Prototype</div></div>
    </div>
    <div class="badge" id="badge">Illustrative data &amp; outputs</div>
  </header>

  <div class="stepper" id="stepper"></div>
  <div class="stage" id="stage"></div>

  <div class="controls">
    <div class="lgroup">
      <button class="btn ghost" id="back">‹ Back</button>
      <button class="btn ghost" id="reset" title="Reset to start (Esc)">↺ Reset</button>
    </div>
    <div class="ctrlhint" id="hint"></div>
    <button class="btn primary" id="next">Begin ›</button>
  </div>

  <footer>
    Scripted walkthrough of the target operating loop · signals &amp; figures are illustrative<br>
    <span class="keys">←/→ navigate · Space advance · Esc reset</span><br>
    <span id="footSource"></span>
  </footer>
</div>

<script>

function validateConfig(c){

  if(c.advisory_full && (typeof c.advisory_full!=='object' || typeof c.advisory_full.text!=='string')) c.advisory_full=null;
  if(!Array.isArray(c.steps)) c.steps=['','','','','','',''];
  if(!Array.isArray(c.next_labels)) c.next_labels=['Begin ›','Next ›','Next ›','Next ›','Next ›','Next ›','Next ›','Run again ↺'];
  if(!Array.isArray(c.hints)) c.hints=['','','','','','',''];
  if(!c.anchor||typeof c.anchor!=='object') c.anchor={};
  if(!c.stats||typeof c.stats!=='object') c.stats={};
}

function phScene(i){const name=(STEPS&&STEPS[i])||('Step '+i);
  return '<div class="scene"><div class="eyebrow">'+name+'</div><h2>This step can\'t render from the current config</h2>'

function T(fn,ms){if(REDUCED){fn();return 0;}const id=setTimeout(fn,ms);timers.push(id);return id}

function renderStepper(){

function statPill(s){const map={covered:'covered',partial:'partial',gap:'gap'};return `<span class="pill ${map[s]}">${s==='gap'?'not covered':s}</span>`}

function coverageIndex(extra){

function streamAdvisory(){
  if(ADVISORY_FULL){  // verbatim source document: render it whole + scrollable, then extract — no typewriter
    const el=document.getElementById('docfull');
    if(el) el.textContent=ADVISORY_FULL.text;   // textContent keeps the gov text literal + injection-safe
    T(extractSignals,350);return;
  }
  const el=document.getElementById('doctext');
  if(REDUCED){  // one-shot: full advisory with its highlights, then extract — no per-word typing
    el.innerHTML=ADVISORY.map(s=>s.hl?`<span class="hl">${s.t}</span>`:s.t).join('');
    extractSignals();return;
  }
  let html='';let i=0;
  function step(){
    if(i>=ADVISORY.length){el.innerHTML=html;T(extractSignals,350);return}
    const seg=ADVISORY[i];const words=seg.t.split(' ');let w=0;
    function word(){
      if(w>=words.length){i++;T(step,seg.hl?180:40);return}
      const piece=words[w]+(w<words.length-1?' ':'');
      html+=seg.hl?`<span class="hl">${piece}</span>`:piece;
      el.innerHTML=html+'<span class="caret"></span>';w++;T(word,seg.hl?34:18);
    }word();
  }step();
}
function extractSignals(){

  });

function animVal(id,from,to,dur,suf){
  const el=document.getElementById(id);if(!el)return;
  if(REDUCED){el.textContent=(suf===''?to.toLocaleString():to)+suf;return;}  // jump to final number

  requestAnimationFrame(f);
}

  nextBtn.textContent=NEXT_LABEL[act];hint.textContent=HINTS[act];
  backBtn.style.visibility=act===0?'hidden':'visible';
  if(act===3){nextBtn.disabled=selected.size===0;nextBtn.textContent=`Build selected (${selected.size}) ›`;}
  else nextBtn.disabled=false;
}
// ---- navigation primitives (buttons AND keys route through these so the gates hold once) ----
function advance(){
  if(nextBtn.disabled) return;              // honors gate #1 (Act 3 / 0 selected) + the Act-4 build lock
  if(act===RENDER.length-1){reset();return;}
  if(act===4 && !confirmed){confirmed=true;nextBtn.disabled=true;nextBtn.textContent='Building…';   // gate #2
    runBuildAfterConfirm(()=>{nextBtn.disabled=false;goto(5);});return;}
  goto(act+1);
}
function back(){if(act===0)return;if(act===4)confirmed=false;goto(act-1);}
function reset(){selected=new Set(TARGET?[TARGET.id]:[]);confirmed=false;maxReached=0;goto(0);}

nextBtn.onclick=advance;
backBtn.onclick=back;
resetBtn.onclick=reset;

// keyboard: ←/→ navigate, Space advances, Esc resets. Keys call advance(), which checks
// nextBtn.disabled — so → can never bypass either human gate (programmatic .onclick() ignores
// the disabled attribute, so the guard must live in advance()).
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target&&e.target.tagName)) return;
  const onBtn=e.target&&e.target.tagName==='BUTTON';
  switch(e.key){
    case 'ArrowRight': case 'PageDown': e.preventDefault(); advance(); break;
    case 'ArrowLeft':  case 'PageUp':   e.preventDefault(); back();    break;
    case ' ': case 'Spacebar': if(onBtn) break; e.preventDefault(); advance(); break;  // let a focused button self-activate
    case 'Escape': e.preventDefault(); reset(); break;
  }
});

function setChromeText(id,txt){const el=document.getElementById(id);if(el!=null&&txt!=null)el.textContent=txt;}
function applyChrome(){
  setChromeText('brandTitle',BRAND.title);
  setChromeText('brandSub',BRAND.subtitle);
  setChromeText('badge',BADGE);
  const fs=document.getElementById('footSource');if(fs&&ANCHOR.source!=null)fs.innerHTML=ANCHOR.source;
}

applyChrome();
goto(0);
</script>
