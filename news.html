<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Watch — Adverse-Media Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1116; --bg2:#0b0e13; --panel:#161b22; --panel2:#1b2230; --ink:#e8edf4;
  --muted:#8b97a8; --faint:#5f6b7c; --signal:#f6a623; --line:#26303d; --line2:#313c4b;
  --ok:#54c08a; --warn:#e0654b; --chip:#202a38;
  --mono:'JetBrains Mono',ui-monospace,monospace; --head:'Archivo',system-ui,sans-serif;
  --serif:'Newsreader',Georgia,serif; --body:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{line-height:1.5;padding:0 0 90px}
a{color:var(--signal)}
em{color:var(--signal);font-style:italic}
.badge{position:fixed;top:10px;right:12px;z-index:50;background:rgba(246,166,35,.12);
  border:1px solid var(--signal);color:var(--signal);font:600 11px/1 var(--mono);
  letter-spacing:.03em;padding:6px 9px;border-radius:5px}
header.top{padding:20px 28px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px}
header.top .brand{font:700 15px/1.2 var(--head);letter-spacing:.02em}
header.top .sub{color:var(--muted);font:500 12px/1.4 var(--mono)}
main{max-width:1060px;margin:0 auto;padding:22px 28px}
h1{font:600 27px/1.2 var(--head);margin:0 0 8px;letter-spacing:-.01em}
h2{font:600 18px/1.3 var(--head);margin:24px 0 10px}
h2 em{font-family:var(--serif)}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--signal);margin-bottom:10px}
.lead{color:var(--muted);font:400 16px/1.6 var(--serif);max-width:74ch;margin:0 0 4px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}
.framenote{color:var(--faint);font:400 13px/1.6 var(--serif);margin-top:16px;max-width:80ch;border-left:2px solid var(--line2);padding-left:13px}

/* the step rail — makes the arc legible: Select › Read › Screen › Disposition › Exposure */
.rail{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 20px;font:600 11px/1 var(--mono);letter-spacing:.04em}
.rail .st{display:flex;align-items:center;gap:7px;color:var(--faint);text-transform:uppercase}
.rail .st .dot{width:19px;height:19px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font:600 10px/1 var(--mono);color:var(--faint)}
.rail .st.done{color:var(--muted)} .rail .st.done .dot{border-color:var(--ok);color:var(--ok)}
.rail .st.now{color:var(--signal)} .rail .st.now .dot{border-color:var(--signal);color:var(--signal);background:rgba(246,166,35,.12)}
.rail .sep{color:var(--line2)}

.tiles{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;min-width:128px}
.tile .n{font:600 27px/1 var(--head);color:var(--signal)}
.tile .l{color:var(--muted);font:500 11px/1.3 var(--mono);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;
  cursor:pointer;transition:border-color .14s,transform .14s;text-align:left;color:var(--ink);font-family:var(--body)}
.card:hover,.card:focus-visible{border-color:var(--signal);transform:translateY(-1px);outline:none}
.card .ttl{font:600 15px/1.35 var(--head)}
.card .src{color:var(--faint);font:500 11px/1.5 var(--mono);margin-top:8px}
.card .meta{color:var(--muted);font:500 11px/1.4 var(--mono);margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;
  padding:2px 10px;font:500 11px/1.6 var(--mono);color:var(--muted)}
.chip.sig{color:var(--signal);border-color:var(--signal)}
.chip.ty{color:var(--ink);border-color:var(--line2)}

.srccap{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:8px;
  padding:10px 14px;margin:14px 0 4px;font:400 12.5px/1.55 var(--mono);color:var(--muted)}
.srccap b{color:var(--signal);font-weight:600}
.srccap .u{color:var(--faint);word-break:break-all}

/* Read: article (left) + extraction (right) */
.artwrap{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start;margin-top:6px}
@media(max-width:860px){.artwrap{grid-template-columns:1fr}}
.collabel{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.doc{position:relative;border:1px solid var(--line);background:var(--bg2);border-radius:11px;padding:16px 18px;
  max-height:430px;overflow:auto;font-family:var(--serif);font-size:15px;line-height:1.78;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.doc .hl{border-radius:3px;padding:0 2px;transition:background .35s,box-shadow .35s,color .35s}
.doc .hl.on{background:rgba(246,166,35,.16);color:var(--ink);box-shadow:inset 0 -1px 0 var(--signal)}
.doc .ent{border-radius:3px;padding:0 2px;background:rgba(84,192,138,.12);color:#bfe9d3;box-shadow:inset 0 -1px 0 var(--ok);transition:background .35s,box-shadow .35s,color .35s}
.doc.reading::after{content:'▌';color:var(--signal);animation:cblink 1.05s steps(2) infinite}
@keyframes cblink{50%{opacity:0}}
@media(prefers-reduced-motion:no-preference){.doc .hl.on{animation:hlflash .55s ease-out}.doc .ent{animation:entflash .55s ease-out}}
@keyframes hlflash{from{background:rgba(246,166,35,.5)}}
@keyframes entflash{from{background:rgba(84,192,138,.4)}}
.xstack{display:flex;flex-direction:column;gap:18px;max-height:430px;overflow:auto;padding-right:2px}
.ecard{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 13px;opacity:1}
.ecard.in{opacity:0;transform:translateX(8px);animation:brin .4s forwards}
.ecard .eh{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ecard .en{font:600 14px/1.35 var(--head);color:var(--ink)}
.echip{font:600 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;white-space:nowrap}
.echip.person{color:#bfe9d3;border:1px solid var(--ok)} .echip.org{color:var(--signal);border:1px solid var(--signal)}
.eattrs{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:9px}
.eattr{font:500 11px/1.4 var(--mono);color:var(--muted)} .eattr b{color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px;margin-right:4px}
.ectx{font:400 12.5px/1.5 var(--serif);color:var(--faint);margin-top:8px}
.xrow{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 12px;opacity:1}
.xrow.in{opacity:0;transform:translateX(8px);animation:brin .4s forwards}
.xrow .xv{font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.5}
.xrow .xa{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin:5px 0}
.xrow .xr{font-size:13.5px;color:var(--ink);line-height:1.4}
.xrow .xc{font:500 9.5px/1 var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
@keyframes brin{to{opacity:1;transform:none}}

/* Screen: the scan process */
.scanhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:14px 0 8px}
.scanctr{font:600 12px/1 var(--mono);color:var(--signal)}
.thline{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:var(--faint);font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.thline::before,.thline::after{content:'';flex:1;height:1px;background:var(--line2)}
.rows{display:grid;gap:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 15px}
.row.in{opacity:0;animation:rin .34s forwards}
@keyframes rin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.row.hit{border-color:var(--signal)} .row.below{opacity:.5}
.row .who{font:600 14px/1.35 var(--head)}
.row .sub{color:var(--muted);font:500 11px/1.45 var(--mono);margin-top:4px}
.score{font:600 14px/1 var(--mono);padding:7px 10px;border-radius:7px;background:var(--chip);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.score.s-hi{color:var(--signal);border-color:var(--signal)}
.tag{font:600 10px/1 var(--mono);padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;margin-left:7px}
.tag.exact{background:rgba(224,101,75,.16);color:#ef8b73;border:1px solid var(--warn)}
.tag.near{background:rgba(246,166,35,.16);color:var(--signal);border:1px solid var(--signal)}
.tag.none{color:var(--faint);border:1px solid var(--line)}
.flagtrap{color:var(--warn);font:600 11px/1.4 var(--mono);margin-top:4px}

/* Disposition + Exposure */
.hitbtn{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px;cursor:pointer;color:var(--ink);font-family:var(--body)}
.hitbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.hitbtn[aria-pressed="true"]{border-color:var(--ok);background:rgba(84,192,138,.07)}
.hitbtn[aria-pressed="false"]{opacity:.6;border-style:dashed}
.disp{font:600 11px/1 var(--mono);padding:7px 10px;border-radius:6px;white-space:nowrap}
.disp.on{color:var(--ok);border:1px solid var(--ok)} .disp.off{color:var(--muted);border:1px solid var(--line)}
.note{color:var(--muted);font:400 14px/1.6 var(--serif);margin-top:14px;max-width:78ch}
.note b{color:var(--ink)}

.nav{display:flex;gap:10px;align-items:center;margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font:600 13px/1 var(--head);padding:11px 18px;border-radius:8px;cursor:pointer;transition:.16s}
.btn:hover{border-color:var(--signal)}
.btn.primary{background:var(--signal);color:#10141a;border-color:var(--signal)}
.keyhint{color:var(--faint);font:500 11px/1 var(--mono);margin-left:auto}
.crumbs{color:var(--muted);font:500 12px/1 var(--mono);margin-bottom:14px}
.crumbs a{cursor:pointer;color:var(--signal)}
footer{max-width:1060px;margin:28px auto 0;padding:16px 28px;border-top:1px solid var(--line);color:var(--faint);font:400 12px/1.65 var(--mono)}

/* accent + affordance polish (dossier feel) */
::selection{background:var(--signal);color:#10141a}
header.top{border-top:2px solid var(--signal)}
.btn:focus-visible,.card:focus-visible,.hitbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.card:hover .ttl{color:var(--signal)}
.tile:hover{border-color:var(--signal)}
.ecard:hover{border-color:var(--signal)}
.xrow:hover{border-color:var(--signal)}
.row:hover{border-color:var(--signal)}
.doc::-webkit-scrollbar,.xstack::-webkit-scrollbar{width:9px}
.doc::-webkit-scrollbar-thumb,.xstack::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.doc::-webkit-scrollbar-thumb:hover,.xstack::-webkit-scrollbar-thumb:hover{background:var(--signal)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="badge" id="badge">Illustrative data &amp; outputs</div>
<header class="top">
  <div class="brand" id="brand">Signal Watch</div>
  <div class="sub" id="brandsub">Adverse-Media Stream · Vision Prototype</div>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<script>
"use strict";
/* Phase 31 (M8) — the adverse-media / negative-news stream. A SECOND atom stream: read a news
   article → its grounded entities + red flags → fuzzy-match the entities against a SYNTHETIC
   client/counterparty book → potential exposure → human disposition. All client-side, offline.
   Phase 32 — REAL US-federal gov-enforcement articles (DOJ/OFAC, public domain 17 U.S.C. §105);
   the book stays synthetic. Presentation elevated to the corpus's bar: a streaming "agent reading"
   Read with entity cards, and a visible scan PROCESS on Screen. Data inlined at build time. */
const NEWS = __NEWS__;
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);

const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- timers (so reduced-motion + the string-DOM harness fold animation into the final state) ---- */
let timers = [];
function clearTimers(){ timers.forEach(t => clearTimeout(t)); timers = []; }
function T(fn, ms){ if(REDUCED){ fn(); return 0; } const id = setTimeout(fn, ms); timers.push(id); return id; }

/* ---- state machine -------------------------------------------------------- */
const state = { view:'select', articleId:null, dispo:{} };
function go(view, articleId){ clearTimers(); state.view = view; if(articleId!==undefined) state.articleId = articleId; render(); }
function articleById(id){ return NEWS.articles.find(a => a.id === id); }

/* ---- the fuzzy matcher (the new muscle) ----------------------------------- */
/* Normalize → token-sort → Jaro-Winkler. Real string-similarity, computed in-browser, offline.
   Word-order-robust (token-sort) + typo/prefix tolerant (Jaro-Winkler) — it surfaces the
   near-matches an exact-name screen would miss. */
const M_SUFFIX = new Set(['ltd','llc','inc','co','group','plc','corp','limited','holdings','sa','ag','gmbh']);
function mnorm(s){ return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function tokensort(s, drop){
  let t = mnorm(s).split(' ');
  if(drop){ const f = t.filter(x => !M_SUFFIX.has(x)); if(f.length) t = f; }
  return t.slice().sort().join(' ');
}
function jaro(a,b){
  if(a===b) return 1; if(!a.length || !b.length) return 0;
  const md = Math.max(0, (Math.max(a.length,b.length) >> 1) - 1);
  const am = new Array(a.length).fill(false), bm = new Array(b.length).fill(false);
  let m = 0;
  for(let i=0;i<a.length;i++){
    const lo = Math.max(0, i-md), hi = Math.min(i+md+1, b.length);
    for(let j=lo;j<hi;j++){ if(!bm[j] && b[j]===a[i]){ am[i]=bm[j]=true; m++; break; } }
  }
  if(!m) return 0;
  let t = 0, k = 0;
  for(let i=0;i<a.length;i++){ if(am[i]){ while(!bm[k]) k++; if(a[i]!==b[k]) t++; k++; } }
  t /= 2;
  return (m/a.length + m/b.length + (m-t)/m) / 3;
}
function jw(a,b){
  const j = jaro(a,b); let p = 0;
  const lim = Math.min(a.length, b.length, 4);
  for(let i=0;i<lim;i++){ if(a[i]===b[i]) p++; else break; }
  return j + p*0.1*(1-j);
}
function simScore(a,b){
  return Math.max(jw(mnorm(a),mnorm(b)), jw(tokensort(a),tokensort(b)), jw(tokensort(a,true),tokensort(b,true)));
}
function threshold(){ return (NEWS.match && NEWS.match.threshold) || 0.85; }
function matchEntities(a){
  const rows = (NEWS.book && NEWS.book.rows) || [];
  const th = threshold();
  return (a.entities||[]).map(en => {
    let best = null;
    for(const r of rows){ const sc = simScore(en.name, r.name); if(!best || sc > best.score) best = {row:r, score:sc}; }
    const score = best ? best.score : 0;
    const hit = score >= th;
    const exact = hit && mnorm(en.name) === mnorm(best.row.name);
    return { entity:en, row: best?best.row:null, score, hit, exact, kind: !hit?'none':(exact?'exact':'near') };
  });
}

/* ---- article highlighting: red-flag phrases + entity names, position-merged ---- */
/* Returns {html, spans}. html = FINAL resting state (every phrase/entity wrapped). spans = sorted,
   non-overlapping [start,end,kind,idx] used by the renderRead stream to reveal each as the read
   edge reaches it. kind:'hl' (red flag, idx into red_flags) or 'ent' (entity, idx into entities). */
function findAll(hay, needle){
  const out = []; if(!needle) return out; let i = 0;
  while((i = hay.indexOf(needle, i)) !== -1){ out.push([i, i+needle.length]); i += needle.length; }
  return out;
}
function articleSpans(raw, flags, ents){
  const spans = [];
  (flags||[]).forEach((f,fi) => findAll(raw, f.flag).forEach(([s,e]) => spans.push({s,e,kind:'hl',idx:fi,title:f.red_flag})));
  (ents||[]).forEach((en,ei) => findAll(raw, en.name).forEach(([s,e]) => spans.push({s,e,kind:'ent',idx:ei,title:en.type})));
  spans.sort((a,b) => a.s-b.s || (b.e-b.s)-(a.e-a.s));
  const picked = []; let last = -1;
  for(const sp of spans){ if(sp.s >= last){ picked.push(sp); last = sp.e; } }
  return picked;
}
function spanHTML(raw, sp){
  const cls = sp.kind==='hl' ? 'hl on' : 'ent';
  const tag = sp.kind==='hl' ? 'span' : 'span';
  return '<'+tag+' class="'+cls+'" title="'+esc(sp.title)+'">'+esc(raw.slice(sp.s, sp.e))+'</'+tag+'>';
}
function highlightBody(raw, flags, ents){
  const picked = articleSpans(raw, flags, ents);
  let html = '', pos = 0;
  for(const sp of picked){ html += esc(raw.slice(pos, sp.s)) + spanHTML(raw, sp); pos = sp.e; }
  return html + esc(raw.slice(pos));
}

/* ---- arc navigation + the step rail --------------------------------------- */
const STEP = ['read','screen','disposition','close'];
const STEP_LABEL = { read:'Read', screen:'Screen', disposition:'Disposition', close:'Exposure' };
const RAIL = [['select','Select'],['read','Read'],['screen','Screen'],['disposition','Disposition'],['close','Exposure']];
function rail(view){
  const order = RAIL.map(r=>r[0]); const cur = order.indexOf(view);
  let h = '<div class="rail">';
  RAIL.forEach((r,i) => {
    const cls = i<cur ? 'done' : (i===cur ? 'now' : '');
    h += (i?'<span class="sep">›</span>':'') + '<span class="st '+cls+'"><span class="dot">'+(i<cur?'✓':(i+1))+'</span>'+r[1]+'</span>';
  });
  return h + '</div>';
}
function crumbs(view){
  const a = articleById(state.articleId);
  return '<div class="crumbs"><a id="cb-sel">Articles</a> › '+esc(a?a.title:'')+'</div>';
}
function arcNav(view){
  const i = STEP.indexOf(view);
  const nextLabel = i < STEP.length-1 ? STEP_LABEL[STEP[i+1]]+' →' : null;
  return '<div class="nav"><button class="btn" id="nav-back">← Back</button>'
    + (nextLabel ? '<button class="btn primary" id="nav-next">'+nextLabel+'</button>' : '')
    + '<span class="keyhint">← back · → next · Esc articles</span></div>';
}
function wireNav(){
  const cb = document.getElementById('cb-sel'); if(cb) cb.addEventListener('click', ()=>go('select'));
  const b = document.getElementById('nav-back'); if(b) b.addEventListener('click', stepBack);
  const n = document.getElementById('nav-next'); if(n) n.addEventListener('click', stepNext);
}
function stepNext(){ const i = STEP.indexOf(state.view); if(i>=0 && i<STEP.length-1) go(STEP[i+1]); }
function stepBack(){ const i = STEP.indexOf(state.view); if(i<=0) go('select'); else go(STEP[i-1]); }

function srcCap(a){
  return '<div class="srccap"><b>Source.</b> '+esc(a.source_org||'')
    + (a.basis ? ' · '+esc(a.basis) : '')
    + (a.source_url ? '<br><span class="u">'+esc(a.source_url)+(a.archived?' (archived '+esc(a.archived)+')':'')+'</span>' : '')
    + '</div>';
}

/* ---- Select --------------------------------------------------------------- */
function renderSelect(){
  const arts = NEWS.articles;
  const ents = arts.reduce((n,a)=>n+(a.entities||[]).length,0);
  const flags = arts.reduce((n,a)=>n+(a.red_flags||[]).length,0);
  const book = (NEWS.book && NEWS.book.rows) ? NEWS.book.rows.length : 0;
  let h = rail('select');
  h += '<div class="eyebrow">Adverse-media / negative-news stream</div>';
  h += '<h1>What aren’t we watching?</h1>';
  h += '<p class="lead">A second monitoring stream — over unstructured news. For each real enforcement article the '
     + 'agent extracts the named entities and the red-flag conduct, then fuzzy-matches the entities against the '
     + 'institution’s client &amp; counterparty book to surface potential exposure: the matches an exact-name '
     + 'screen would miss. The articles are real US-federal enforcement records (public domain); the book is synthetic.</p>';
  h += '<div class="tiles">'
     + tile(arts.length,'real articles') + tile(ents,'entities extracted')
     + tile(flags,'red flags') + tile(book,'book entries (synthetic)') + '</div>';
  h += '<h2>Select an article</h2><div class="cards">';
  for(const a of arts){
    h += '<button class="card" data-id="'+esc(a.id)+'">'
       + '<div class="ttl">'+esc(a.title)+'</div>'

function streamRead(a, ents, flags){
  const docEl = document.getElementById('doc');
  const entEl = document.getElementById('entities'), flagEl = document.getElementById('redflags');
  const dlbl = document.getElementById('doclabel'), elbl = document.getElementById('entlabel'), flbl = document.getElementById('flaglabel');
  // template above is the FINAL resting state → reduced-motion + the string-DOM harness already show it.
  if(REDUCED || !docEl || typeof docEl.insertAdjacentHTML !== 'function') return;
  const raw = a.article_text;
  const spans = articleSpans(raw, flags, ents), L = raw.length;
  // ordered runs: plain text (kind null) + each highlighted span
  const segs = []; let c0 = 0;
  for(const sp of spans){ if(sp.s>c0) segs.push({s:c0,e:sp.s,sp:null}); segs.push({s:sp.s,e:sp.e,sp}); c0 = sp.e; }
  if(c0<L) segs.push({s:c0,e:L,sp:null});
  if(entEl) entEl.innerHTML=''; if(flagEl) flagEl.innerHTML='';
  docEl.innerHTML=''; if(docEl.classList) docEl.classList.add('reading');
  let ec=0, fc=0;
  const setLabels = ()=>{ if(dlbl)dlbl.textContent='Source document · reading…';
    if(elbl)elbl.textContent='Named entities · '+ec; if(flbl)flbl.textContent='Red flags · extract → translate · '+fc; };
  setLabels();
  const STEP=33, TOTAL=Math.max(6000,Math.min(45000,Math.round(L*1.0)));
  const TICKS=Math.max(40,Math.round(TOTAL/STEP)), CPS=Math.max(8,Math.ceil(L/TICKS));
  let si=0, within=0; const eShown=new Set(), fShown=new Set();
  function read(){
    let budget=CPS, buf='';
    while(budget>0 && si<segs.length){
      const sg=segs[si], rem=(sg.e-sg.s)-within;
      if(!sg.sp){ const take=Math.min(budget,rem); buf+=esc(raw.slice(sg.s+within, sg.s+within+take)); within+=take; budget-=take; }
      else {
        buf += spanHTML(raw, sg.sp);
        if(sg.sp.kind==='ent' && entEl && !eShown.has(sg.sp.idx)){ eShown.add(sg.sp.idx); ec++; entEl.insertAdjacentHTML('beforeend', ecardHTML(ents[sg.sp.idx], true)); }
        if(sg.sp.kind==='hl' && flagEl && !fShown.has(sg.sp.idx)){ fShown.add(sg.sp.idx); fc++; flagEl.insertAdjacentHTML('beforeend', xrowHTML(flags[sg.sp.idx], true)); }
        within=sg.e-sg.s; budget-=rem;
      }
      if(within>=sg.e-sg.s){ si++; within=0; }
    }
    if(buf) docEl.insertAdjacentHTML('beforeend', buf);
    if(docEl.scrollHeight) docEl.scrollTop=docEl.scrollHeight;
    if(elbl)elbl.textContent='Named entities · '+ec; if(flbl)flbl.textContent='Red flags · extract → translate · '+fc;
    if(si<segs.length){ T(read,STEP); return; }
    if(docEl.classList) docEl.classList.remove('reading');
    ents.forEach((e,i)=>{ if(entEl && !eShown.has(i)){ eShown.add(i); ec++; entEl.insertAdjacentHTML('beforeend', ecardHTML(e,true)); } });
    flags.forEach((f,i)=>{ if(flagEl && !fShown.has(i)){ fShown.add(i); fc++; flagEl.insertAdjacentHTML('beforeend', xrowHTML(f,true)); } });
    if(dlbl)dlbl.textContent='Source document · '+ents.length+' entit'+(ents.length===1?'y':'ies')+' · '+flags.length+' red flag'+(flags.length===1?'':'s');
    if(elbl)elbl.textContent='Named entities · '+ents.length; if(flbl)flbl.textContent='Red flags · extract → translate · '+flags.length;
  }
  T(read,240);
}

/* Phase 39 — /extract answers an NDJSON STREAM of stage events ending in {done} or {error}; read it
   incrementally so the analyst sees WHERE the pipeline is (the per-entity verify loop is the wall-time
   majority) instead of a silent multi-minute wait. Falls back to whole-body parsing if the browser
   exposes no ReadableStream. */
async function liveReadStream(r, onEvent){
  let buf = '', last = null;
  const feed = chunk => {
    buf += chunk; let i;
    while((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if(!line) continue;
      let ev; try{ ev = JSON.parse(line); }catch(_){ continue; }
      if(ev.done !== undefined) last = ev.done;
      else if(ev.error !== undefined) last = ev;
      else onEvent(ev);
    }
  };
  if(r.body && r.body.getReader){
    const reader = r.body.getReader(); const dec = new TextDecoder();
    for(;;){
      const {done, value} = await reader.read();
      if(value) feed(dec.decode(value, {stream:true}));
      if(done) break;
    }
  }else{
    feed(await r.text()); feed('\n');
  }
  return last || { error: 'the extraction stream ended without a result' };
}
function liveStageLabel(ev){
  if(ev.stage === 'fetching')   return 'Fetching + converting the URL (server-side ladder)…';
  if(ev.stage === 'converted')  return 'Converted — ' + (ev.text ? ev.text.length : 0) + ' chars; extracting…';
  if(ev.stage === 'extracting') return 'Model extracting entities + red flags…';
  if(ev.stage === 'grounding')  return 'Grounding the extraction against the source…';
  if(ev.stage === 'verifying')  return 'Verifying entity ' + ev.i + ' of ' + ev.n + (ev.name ? (' — ' + ev.name) : '') + '…';
  return 'Processing…';
}
/* The 'converted' event is the one-shot URL mode's passive recovery: the server-acquired text fills
   the textarea AS the run proceeds, so the analyst sees exactly what the model saw and can trim +
   re-run (pasted text wins over the URL on the next run). */
function liveApplyConverted(ev){
  if(ev.stage !== 'converted') return;
  const ta = document.getElementById('live-text');
  if(ta) ta.value = ev.text || '';
  const ti = document.getElementById('live-title');
  if(ti && !ti.value.trim() && ev.title) ti.value = ev.title;
}
async function liveRun(){
  const status = document.getElementById('live-status');

  const url = ((document.getElementById('live-url') || {}).value || '').trim();
  if(!text && !url){ status.textContent = 'Give an article URL or paste some article text first.'; return; }
  const t0 = Date.now();
  let stage = url && !text ? 'Contacting the companion (URL acquisition)…' : 'Contacting the local model…';
  const paint = () => { status.textContent = stage + ' · ' + Math.round((Date.now() - t0) / 1000) + 's'; };
  const tick = setInterval(paint, 1000);
  paint();
  try{
    const r = await fetch(NEWS.live.extract, { method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ text, url,
        title: (document.getElementById('live-title').value || '').trim(),
        source_org: (document.getElementById('live-source').value || '').trim(),
        source_type: ((document.getElementById('live-stype') || {}).value || '') }) });
    if(!r.ok){  // request-shape errors (400) are plain JSON, before any stream begins
      const d = await r.json().catch(() => ({}));
      clearInterval(tick);
      status.textContent = 'Extraction failed: ' + (d.error || ('HTTP ' + r.status)); return;
    }
    const data = await liveReadStream(r, ev => { liveApplyConverted(ev); stage = liveStageLabel(ev); paint(); });
    clearInterval(tick);
    if(data.error){ status.textContent = 'Extraction failed: ' + data.error; return; }
    const rec = data.record, drop = (data.dropped || []).length;
    rec.scan_id = data.scan_id || null;            // Phase 36: lets the Disposition gate escalate THIS scan's entities
    const i = NEWS.articles.findIndex(a => a.id === rec.id);
    if(i >= 0) NEWS.articles[i] = rec; else NEWS.articles.unshift(rec);
    status.textContent = rec.entities.length + ' entities · ' + rec.red_flags.length + ' red flags grounded'
      + (drop ? (' · ' + drop + ' ungrounded dropped') : '')
      + ' · ' + Math.round((Date.now() - t0) / 1000) + 's';
    await liveRefreshWatchlist();                  // screen this scan against the current escalated watchlist
    go('read', rec.id);
  }catch(ex){

  }
}

async function livePrune(name){
  if(!NEWS.live || !NEWS.live.prune || !name) return;
  try{
    const r = await fetch(NEWS.live.prune, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name }) });

  }catch(ex){ /* transient — leave the panel as-is */ }

/* Screen against book ∪ watchlist. A live-only REASSIGNMENT (the offline matchEntities, byte-frozen via the
   strip, stays book-only); the live screen is ALIAS-AWARE (Phase 41): an entity or watchlist row is
   matchable by name ∪ aliases, taking the MAX pair score. CLASS-AWARE alias rules guard the 0.85 fuzzy
   threshold against a false-positive flood: a single-token alias ("Smith") or an @-handle never enters
   generic fuzzy matching — it matches EXACT-NORMALIZED only; multi-token aliases ("M. Lopez") fuzzy-score
   like names. The body mirrors the base shape deliberately — refactoring the base signature would change
   dist/news, which must stay byte-identical. */
const _baseMatchEntities = matchEntities;
function liveAliasFuzzyOk(s){
  return !String(s).startsWith('@') && mnorm(s).split(' ').filter(Boolean).length >= 2;
}
function livePairScore(a, aIsAlias, b, bIsAlias){
  if((aIsAlias && !liveAliasFuzzyOk(a)) || (bIsAlias && !liveAliasFuzzyOk(b))){
    return mnorm(a) === mnorm(b) ? 1 : 0;          // restricted alias class: exact-normalized only
  }
  return simScore(a, b);
}
function liveBestPair(en, r){
  const lefts  = [[en.name, false]].concat((en.aliases || []).map(x => [x, true]));
  const rights = [[r.name,  false]].concat((r.aliases  || []).map(x => [x, true]));
  let best = { score: 0, via: null };
  for(const [a, ai] of lefts){ for(const [b, bi] of rights){
    const sc = livePairScore(a, ai, b, bi);
    if(sc > best.score) best = { score: sc, via: (ai || bi) ? { entity: a, row: b } : null };
  } }
  return best;
}
matchEntities = function(a){
  const extra = NEWS._watch || [];
  const live = a && a.id && String(a.id).startsWith('live-');
  if(!extra.length && !live) return _baseMatchEntities(a);   // static arc, nothing escalated → byte-frozen base path
  const th = threshold();
  const rows = ((NEWS.book && NEWS.book.rows) || []).concat(extra);
  return (a.entities || []).map(en => {
    let best = null;
    for(const r of rows){
      const p = liveBestPair(en, r);
      if(!best || p.score > best.score) best = { row: r, score: p.score, via: p.via };
    }
    const score = best ? best.score : 0, hit = score >= th, exact = hit && mnorm(en.name) === mnorm(best.row.name);
    return { entity:en, row: best?best.row:null, score, hit, exact,
             kind: !hit?'none':(exact?'exact':'near'), via: hit ? best.via : null };
  });
};
async function livePostDisposition(eid, decision){

  try{

      body: JSON.stringify({ scan_id:a.scan_id, entity_id:eid, decision }) });
    if(!r.ok) return false;
    await liveRefreshWatchlist();                   // reflect the new (or removed) watchlist row immediately

/* Phase 42 — the subject-map NETWORK layout: a PURE deterministic data→positions function (no DOM, no
   randomness — the dep-free harness asserts it directly). Main subjects sit central (one main → dead
   center; several → an inner ring); everyone else on an outer ring, radially placed then relaxed a FIXED
   number of iterations (each outer node drifts toward the mean angle of its neighbours, then a minimum
   angular gap is re-enforced). Degenerate shapes tolerated: a from==to edge (a post-fold artifact) is
   skipped; an edge endpoint that isn't an extracted entity is synthesized as a node (the edge is kept). */
function liveGraphLayout(entities, relationships, mains, W, H){
  W = W || 720; H = H || 380;
  const names = (entities || []).map(e => e.name).filter(Boolean);
  const seen = new Set(names);
  const edges = [];
  (relationships || []).forEach(r => {
    if(!r || !r.from || !r.to || r.from === r.to) return;
    [r.from, r.to].forEach(n => { if(!seen.has(n)){ seen.add(n); names.push(n); } });
    edges.push({ from: r.from, to: r.to, label: r.label || '', evidence: r.evidence || '' });
  });
  const mainSet = new Set((mains || []).filter(n => seen.has(n)));
  const inner = names.filter(n => mainSet.has(n));
  const outer = names.filter(n => !mainSet.has(n));
  const cx = W/2, cy = H/2, R2 = Math.min(W, H)/2 - 46;
  const R1 = inner.length > 1 ? R2*0.38 : 0;
  const pos = {};
  inner.forEach((n, i) => { pos[n] = { a: -Math.PI/2 + 2*Math.PI*i/Math.max(inner.length, 1), r: R1 }; });
  outer.forEach((n, i) => { pos[n] = { a: -Math.PI/2 + 2*Math.PI*i/Math.max(outer.length, 1), r: R2 }; });
  const nbr = {};
  edges.forEach(e => { (nbr[e.from] = nbr[e.from] || []).push(e.to); (nbr[e.to] = nbr[e.to] || []).push(e.from); });
  const minGap = 2*Math.PI/Math.max(outer.length, 8) * 0.7;
  for(let k = 0; k < 24; k++){
    outer.forEach(n => {
      const ns = (nbr[n] || []).filter(m => pos[m]); if(!ns.length) return;
      let sx = 0, sy = 0;
      ns.forEach(m => { sx += Math.cos(pos[m].a); sy += Math.sin(pos[m].a); });
      let d = Math.atan2(sy, sx) - pos[n].a;
      while(d > Math.PI) d -= 2*Math.PI; while(d < -Math.PI) d += 2*Math.PI;
      pos[n].a += d*0.25;
    });
    const sorted = outer.slice().sort((x, y) => pos[x].a - pos[y].a);
    for(let i = 1; i < sorted.length; i++){
      if(pos[sorted[i]].a - pos[sorted[i-1]].a < minGap) pos[sorted[i]].a = pos[sorted[i-1]].a + minGap;
    }
  }
  const nodes = names.map(n => ({ name: n, main: mainSet.has(n),
    x: Math.round((cx + Math.cos(pos[n].a)*pos[n].r)*10)/10,
    y: Math.round((cy + Math.sin(pos[n].a)*pos[n].r)*10)/10 }));
  return { w: W, h: H, nodes, edges };
}
/* Phase 42 — the subject map rendered as an SVG network (string-built; esc() on EVERY store-derived
   value — names, labels, evidence — the stored-XSS guard). The graph is the navigation surface: the
   evidence quote stays CLOSED until its edge is clicked (svg edge or list row); node clicks open the
   anchor dossier (Phase 42 T3). All inside the LIVE region — the offline build strips every byte. */
function liveRenderSubjectGraph(a){
  const mains = a.main_subjects || [], rels = a.relationships || [];
  if(!(mains.length || rels.length)) return '';
  const g = liveGraphLayout(a.entities || [], rels, mains);
  const P = {}; g.nodes.forEach(n => P[n.name] = n);
  let h = '<div class="relpanel" id="netpanel"><div class="relhead">Subject map — '
        + (mains.length ? ('main subject' + (mains.length > 1 ? 's' : '') + ': ' + mains.map(esc).join(', '))
                        : 'no clear main subject (none forced)') + '</div>';
  h += '<svg class="netsvg" viewBox="0 0 ' + g.w + ' ' + g.h + '" role="img" aria-label="entity relationship network">';
  g.edges.forEach((e, i) => {
    const f = P[e.from], t = P[e.to];
    h += '<g class="gedge" data-ei="' + i + '"><line x1="' + f.x + '" y1="' + f.y + '" x2="' + t.x + '" y2="' + t.y + '"></line>'
       + '<text x="' + Math.round((f.x + t.x)/2) + '" y="' + (Math.round((f.y + t.y)/2) - 4) + '">' + esc(e.label) + '</text></g>';
  });
  g.nodes.forEach(n => {
    const lbl = n.name.length > 20 ? n.name.slice(0, 19) + '…' : n.name;
    h += '<g class="gnode' + (n.main ? ' gmain' : '') + '" data-n="' + esc(n.name) + '">'
       + '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + (n.main ? 9 : 6) + '"></circle>'
       + '<text x="' + n.x + '" y="' + (n.y - (n.main ? 13 : 10)) + '">' + esc(lbl) + '</text></g>';
  });
  h += '</svg>';
  g.edges.forEach((e, i) => {
    const open = a._gsel === i;
    h += '<div class="reledge gerow' + (open ? ' open' : '') + '" data-ei="' + i + '">'
       + '<span class="relwho">' + esc(e.from) + '</span><span class="rellabel">—' + esc(e.label) + '→</span>'
       + '<span class="relwho">' + esc(e.to) + '</span>'
       + (open ? '<div class="relev">“' + esc(e.evidence) + '”</div>' : '')
       + '</div>';
  });
  h += '</div>';
  return h;
}
/* Phase 42 — the ANCHOR DOSSIER: the accumulated identity behind one entity (GET /anchor wraps the
   store's anchor_summary). READ-ONLY by design: same-kind conflicting values arrive as separate
   provenance'd rows and render BOTH with a conflict flag — coexisting claims for the analyst, never a
   resolved value (the store keeps everything; this view resolves nothing). esc() on every value. */
function liveDossierBody(a){
  const scans = a.scans || [];
  let h = '<div class="dossmeta">' + esc(a.type || 'entity')
        + (a.first_source_type ? ' · first seen via ' + esc(a.first_source_type) : '')
        + ' · ' + scans.length + ' scan' + (scans.length === 1 ? '' : 's') + '</div>';
  h += '<div class="dosssec">Scans touching this anchor</div>';
  scans.forEach(s => {
    h += '<div class="dossrow"><span class="dossval">' + esc(s.title || s.scan_id) + '</span>'
       + '<span class="dossprov">' + esc((s.ts || '').slice(0, 10))
       + (s.source_type ? ' · ' + esc(s.source_type) : '') + '</span></div>';
  });
  const groups = {};
  (a.properties || []).forEach(p => { (groups[p.kind] = groups[p.kind] || []).push(p); });
  const aliasRows = groups.alias || []; delete groups.alias;
  const aliases = aliasRows.map(p => p.value).filter((v, i, arr) => arr.indexOf(v) === i);
  if(aliases.length) h += '<div class="lalias">a.k.a. ' + aliases.map(esc).join(' · ') + '</div>';
  const kinds = Object.keys(groups).sort();
  if(kinds.length){
    h += '<div class="dosssec">Claimed properties — per-scan provenance</div>';
    kinds.forEach(k => {
      const rows = groups[k];
      const distinct = rows.map(p => p.value).filter((v, i, arr) => arr.indexOf(v) === i);
      h += '<div class="dosskind"><b>' + esc(k) + '</b>'
         + (distinct.length > 1 ? '<span class="conflict">conflicting values — both kept</span>' : '') + '</div>';
      rows.forEach(p => {
        const pr = p.provenance || {};
        h += '<div class="dossrow"><span class="dossval">' + esc(p.value) + '</span>'
           + '<span class="dossprov">' + esc(pr.title || '') + ' · ' + esc((pr.ts || '').slice(0, 10))
           + (pr.source_type ? ' · ' + esc(pr.source_type) : '') + '</span></div>';
      });
    });
  }
  if((a.relationships || []).length){
    h += '<div class="dosssec">Relationships</div>';
    a.relationships.forEach(r => {
      h += '<div class="reledge"><span class="relwho">' + esc(r.from) + '</span>'
         + '<span class="rellabel">—' + esc(r.label) + '→</span>'
         + '<span class="relwho">' + esc(r.to) + '</span>'
         + '<div class="relev">“' + esc(r.evidence) + '”</div></div>';
    });
  }
  if(!kinds.length && !aliases.length && !(a.relationships || []).length){
    h += '<div class="watchempty">Nothing accumulated beyond the name yet — only the name has been seen. '
       + 'Properties, aliases and relationships join the dossier as further scans (or investigation notes) land.</div>';
  }
  return h;
}

/* Disposition (live): escalate ANY extracted entity to the watchlist. Escalating a book/watchlist HIT also
   confirms it as an exposure (state.dispo) so the Exposure view shows it. Committed (non-persisted) articles
   have no scan_id → fall back to the base gate. */
function liveRenderDisposition(){

  if(!a._escal) a._escal = {};
  const m = matchEntities(a).sort((x,y) => y.score - x.score);
  const byId = {}; m.forEach(x => byId[x.entity.id] = x);
  let h = rail('disposition') + crumbs('disposition');
  h += '<h1>Disposition — the human gate</h1>';
  h += '<p class="lead">The agent proposes; the analyst disposes. <b>Escalate</b> an entity to add it to the '
     + 'live watchlist — every article you screen next is matched against it too. Escalation is how the screen '
     + 'surface compounds; a high score is <em>not</em> a confirmation.</p>';
  // Phase 41/42 — the SUBJECT MAP: who the article is principally about + how the others connect (every
  // edge gate-passed: label vocab-checked, evidence verbatim-grounded; honest none/multiple subjects).
  // Phase 42 renders it as an SVG NETWORK — evidence opens on edge click.
  const mains = a.main_subjects || [];
  h += liveRenderSubjectGraph(a);
  h += '<div id="dossier"></div>';   // Phase 42 — a node click renders the anchor dossier here
  h += '<div class="rows">';
  (a.entities || []).forEach(en => {
    const x = byId[en.id] || { score:0, hit:false, kind:'none', row:null };
    const on = !!a._escal[en.id];
    const sub = x.hit ? ('matches '+esc(x.row.name)+' · '+esc(x.row.role || '')+' · score '+x.score.toFixed(3)
                         + (x.via ? (' · via alias '+esc(x.via.entity)+' ≈ '+esc(x.via.row)) : ''))
                      : 'no current book or watchlist exposure';

    const akas = (en.aliases || []).length
      ? '<div class="lalias">a.k.a. ' + en.aliases.map(esc).join(' · ') + '</div>' : '';
    const props = (en.properties || []).length
      ? '<div class="lprops">' + en.properties.map(p =>
          '<span class="lprop"><b>'+esc(p.kind)+'</b> '+esc(p.value)+'</span>').join('') + '</div>' : '';
    const mainTag = mains.indexOf(en.name) >= 0 ? '<span class="tag main">main subject</span>' : '';
    h += '<button class="hitbtn'+(x.hit?'':' below')+'" data-e="'+esc(en.id)+'" aria-pressed="'+on+'">'
       + '<div><div class="who">'+esc(en.name)+mainTag+'<span class="tag '+x.kind+'">'+(x.hit?x.kind:'no match')+'</span></div>'
       + '<div class="sub">'+sub+'</div>'+akas+props+'</div>'
       + '<span class="disp '+(on?'on':'off')+'">'+(on?'ESCALATED':'＋ WATCHLIST')+'</span></button>';

  h += arcNav('disposition');

  app.querySelectorAll('.hitbtn').forEach(b => b.addEventListener('click', async () => {

    const ok = await livePostDisposition(eid, next ? 'escalate' : 'dismiss');

  ['.gedge', '.gerow'].forEach(sel => app.querySelectorAll(sel).forEach(el => el.addEventListener('click', () => {

  }));

}

    + '.lprop{border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font:11px var(--mono);color:var(--muted)}'
    + '.lprop b{color:var(--ink);font-weight:600}'
    + '.tag.main{color:var(--signal);border:1px solid var(--signal)}';
  const s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
  const baseSelect = RENDER.select;
  RENDER.select = function(){ baseSelect(); liveInjectSelect(); };
  _baseRenderDisposition = RENDER.disposition;
  RENDER.disposition = liveRenderDisposition;
  liveRefreshWatchlist();          // pick up entities escalated in a prior session (the persisted store)
}
if(NEWS.live){ liveInit(); }
/*LIVE_END*/
render();
</script>
</body>
